<title>ひとり社長の会社</title>
<style>
/* Layout: top = 社長への要確認 + 実績, middle = org chart (社長 → 5部署 → 5体 in handoff order), bottom = 依頼 + 成果物. Desktop fits one screen. */
:root{
  --bg:#f1f3f0; --panel:#ffffff; --ink:#17211d; --sub:#5a6962; --line:#d6ddd8; --line2:#c2ccc6;
  --accent:#0d6a5a; --accent-ink:#ffffff;
  --run:#b36500; --run-bg:#fff0d2; --ok:#1b7a49; --ok-bg:#ddf2e5; --wait-bg:#e7ebe8; --bad:#b3261e; --bad-bg:#fbe2df;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --panel:#17201c; --ink:#e5ede8; --sub:#92a299; --line:#2a3731; --line2:#3a4a42;
  --accent:#4fc3a8; --accent-ink:#06211a; --run:#f2b45a; --run-bg:#3a2a0d; --ok:#6fd49b; --ok-bg:#12301f; --wait-bg:#212c26; --bad:#ff8a80; --bad-bg:#3b1815; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --panel:#17201c; --ink:#e5ede8; --sub:#92a299; --line:#2a3731; --line2:#3a4a42;
  --accent:#4fc3a8; --accent-ink:#06211a; --run:#f2b45a; --run-bg:#3a2a0d; --ok:#6fd49b; --ok-bg:#12301f; --wait-bg:#212c26; --bad:#ff8a80; --bad-bg:#3b1815; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;padding-inline:16px;padding-block:14px 28px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--sub)}
.err{color:var(--bad);font-size:12px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:99px;white-space:nowrap}
.s-idle,.s-pending{background:var(--wait-bg);color:var(--sub)}.s-running{background:var(--run-bg);color:var(--run)}
.s-done{background:var(--ok-bg);color:var(--ok)}.s-blocked,.s-open{background:var(--bad-bg);color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.card h2{font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.esc{display:flex;flex-direction:column;gap:8px}
.esc .e{border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.esc .q{overflow-wrap:anywhere}.esc .meta{font-size:12px;color:var(--sub)}
.none{color:var(--sub);border:1px dashed var(--line2);border-radius:8px;padding:9px 10px}
.stats{display:grid;grid-template-columns:auto repeat(2,1fr);gap:4px 12px;align-items:center}
.stats .h{font-size:11.5px;color:var(--sub)}
.bar{height:6px;border-radius:3px;background:var(--wait-bg);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.tot{display:flex;gap:18px;margin-bottom:8px}.tot b{font-size:20px;font-family:var(--mono)}
.org{display:flex;flex-direction:column;align-items:center;gap:0}
.ceo{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:8px;padding:6px 18px}
.rail{width:calc(80% + 0px);max-width:1000px;height:14px;border:1px solid var(--line2);border-bottom:0;border-radius:8px 8px 0 0;margin-top:0;border-top:0}
.trunk{width:1px;height:12px;background:var(--line2)}
.depts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%}
.dept{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dept.running{border-color:var(--run);box-shadow:0 0 0 2px var(--run-bg)}.dept.blocked{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
.dept .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}.dept h3{font-size:14.5px}
.room{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:6px;border:2px solid #2a3550;background:#a5714a}
.room.sel{cursor:pointer}
.ceoroom{display:block;width:100%;max-width:440px;height:auto;image-rendering:pixelated;border-radius:6px;border:2px solid #2a3550}
.pixl{font-family:"DotGothic16","Zen Kaku Gothic New",sans-serif}
.now{font-size:12.5px;min-height:3.2em;overflow-wrap:anywhere}
.foot{font-size:11.5px;color:var(--sub);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.bot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:48px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:700;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:6px 12px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}button:disabled{opacity:.5;cursor:default}
.list{display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item{border:1px solid var(--line);border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}.item .m{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px}
pre{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:12px;background:var(--bg);border-radius:6px;padding:8px;max-height:200px;overflow:auto}
@media(max-width:1000px){.depts{grid-template-columns:repeat(2,minmax(0,1fr))}.top,.bot{grid-template-columns:minmax(0,1fr)}.rail{display:none}}
@media(max-width:520px){.depts{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.node.running .d{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">

<div class="wrap">
  <div class="top">
    <section class="card">
      <h2>社長への要確認 <span class="pill s-idle" id="escCount">0件</span></h2>
      <div class="esc" id="esc"></div>
    </section>
    <section class="card">
      <h2>実績</h2>
      <div class="tot"><div><div class="hint">今日の完了</div><b id="tToday">0</b></div><div><div class="hint">7日間の完了</div><b id="tWeek">0</b></div><div><div class="hint">処理待ち依頼</div><b id="tQueue">0</b></div></div>
      <div class="stats" id="stats"></div>
    </section>
  </div>

  <section class="org" aria-label="組織図">
    <canvas class="ceoroom" id="ceoCanvas" width="480" height="144" aria-label="社長室"></canvas><div class="trunk"></div><div class="rail"></div>
    <div class="depts" id="depts"></div>
  </section>

  <div class="bot">
    <section class="card">
      <h2>依頼する</h2>
      <form id="form" class="list">
        <label for="dept">担当する部署<select id="dept"></select></label>
        <label for="topic">依頼内容<input id="topic" required maxlength="200" placeholder="例: 来週のnote記事のテーマ / ○○社への提案 / 問い合わせ返信"></label>
        <label for="notes">補足(相手・読者・媒体・締切など)<textarea id="notes" maxlength="800"></textarea></label>
        <div class="row"><button id="send" type="submit">依頼を送る</button><span class="hint" id="formMsg"></span></div>
      </form>
      <h2 style="margin-top:10px">依頼キュー</h2><div class="list" id="queue"></div>
      <p class="hint" style="margin-top:6px">依頼は <span class="mono">/run-pipeline</span> の実行で5体が順に処理します。</p>
    </section>
    <section class="card">
      <h2>最近の成果物</h2><div class="list" id="runs"></div>
    </section>
  </div>
</div>

<script>
const DEPTS=[{id:"content",name:"発信"},{id:"sales",name:"営業"},{id:"support",name:"サポート"},{id:"research",name:"リサーチ"},{id:"exec",name:"経営判断"}];
const ROLES=[{id:"strategist",name:"戦略"},{id:"researcher",name:"リサーチ"},{id:"writer",name:"執筆"},{id:"editor",name:"編集"},{id:"publisher",name:"配信"}];
const LABEL={idle:"待機",pending:"待ち",running:"実行中",done:"完了",blocked:"要確認"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dname=id=>(DEPTS.find(d=>d.id===id)||{name:id||"?"}).name;
const ago=iso=>{if(!iso)return"";const d=(Date.now()-new Date(iso))/1000;if(isNaN(d))return"";if(d<60)return"たった今";if(d<3600)return Math.floor(d/60)+"分前";if(d<86400)return Math.floor(d/3600)+"時間前";return Math.floor(d/86400)+"日前"};
let db=null,deps={},reqs=[],runs=[],escs=[];
$("dept").innerHTML=DEPTS.map(d=>`<option value="${d.id}">${d.name}</option>`).join("");

function renderEsc(){
  const open=escs.filter(e=>e.status==="open").sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  $("escCount").textContent=open.length+"件";$("escCount").className="pill "+(open.length?"s-open":"s-idle");
  $("esc").innerHTML=open.length?open.map(e=>`<div class="e" data-id="${esc(e.id)}"><div class="meta">${esc(dname(e.dept))}部 ／ ${esc(e.stage||"")} ／ ${ago(e.createdAt)}</div>
    <div class="q">${esc(e.question)}</div>
    <div class="row"><input aria-label="回答" class="ans" maxlength="400" placeholder="回答・指示を書く" style="flex:1 1 200px"><button class="res">回答して解決</button></div></div>`).join("")
    :'<div class="none">いま社長の判断を待っているものはありません。</div>';
  if(typeof drawAll==="function")drawAll();
  $("esc").querySelectorAll(".e").forEach(el=>el.querySelector(".res").onclick=async()=>{
    if(!db)return;const id=el.dataset.id,a=el.querySelector(".ans").value.trim();
    try{await db.doc("escalations/"+id).update({status:"resolved",answer:a,resolvedAt:new Date().toISOString()})}catch(e){el.querySelector(".meta").insertAdjacentHTML("beforeend",' <span class="err">保存できませんでした</span>')}});
}
function renderStats(){
  const now=Date.now(),day=new Date();day.setHours(0,0,0,0);
  const per={};DEPTS.forEach(d=>per[d.id]={t:0,w:0});
  runs.forEach(r=>{const t=new Date(r.finishedAt).getTime();if(isNaN(t)||!per[r.dept])return;if(t>=day.getTime())per[r.dept].t++;if(t>=now-7*864e5)per[r.dept].w++});
  const T=Object.values(per).reduce((a,x)=>a+x.t,0),W=Object.values(per).reduce((a,x)=>a+x.w,0),mx=Math.max(1,...Object.values(per).map(x=>x.w));
  $("tToday").textContent=T;$("tWeek").textContent=W;$("tQueue").textContent=reqs.filter(r=>r.status==="pending").length;
  $("stats").innerHTML='<span></span><span class="h">今日</span><span class="h">7日間</span>'+DEPTS.map(d=>`<span>${d.name}</span><span class="mono">${per[d.id].t}</span><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="mono" style="min-width:1.5em">${per[d.id].w}</span><span class="bar" style="flex:1"><i style="width:${per[d.id].w/mx*100}%"></i></span></span>`).join("");
}
let selStage={};
function buildDepts(){
  $("depts").innerHTML=DEPTS.map(d=>`<article class="dept" id="dp-${d.id}"><div class="hd"><h3>${d.name}部</h3><span class="pill s-idle" id="dpp-${d.id}">待機</span></div>
    <canvas class="room sel" id="cv-${d.id}" width="${RW*PS}" height="${RH*PS}" role="img" aria-label="${d.name}部のオフィス。担当をクリックすると詳細が出ます"></canvas>
    <div class="now" id="dpn-${d.id}"></div><div class="foot"><span id="dpq-${d.id}"></span><span id="dpt-${d.id}"></span></div></article>`).join("");
  DEPTS.forEach(d=>{$("cv-"+d.id).addEventListener("click",e=>{
    const r=e.currentTarget.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*RH;
    const i=Math.max(0,Math.min(4,Math.floor((y-HEAD)/CELL)));selStage[d.id]=ROLES[i].id;renderDepts()})});
}
function renderDepts(){
  DEPTS.forEach(d=>{
    const x=deps[d.id]||{},st=x.stages||{},state=x.state||"idle";
    const q=reqs.filter(r=>r.dept===d.id&&r.status!=="done").length;
    $("dp-"+d.id).className="dept "+state;
    const p=$("dpp-"+d.id);p.className="pill s-"+state;p.textContent=LABEL[state]||state;
    const sel=selStage[d.id]&&ROLES.find(r=>r.id===selStage[d.id]);
    const act=sel||ROLES.find(r=>(st[r.id]||{}).state==="running")||ROLES.find(r=>(st[r.id]||{}).state==="blocked");
    $("dpn-"+d.id).innerHTML=state==="idle"&&!sel?'<span class="hint">全員待機中。依頼を待っています。</span>':`${x.topic?`<b>${esc(x.topic)}</b><br>`:""}${act?`${act.name}担当: ${esc((st[act.id]||{}).summary||LABEL[(st[act.id]||{}).state||"idle"])}`:state==="done"?"5体すべて完了":""}${x.note?`<br><span class="err">${esc(x.note)}</span>`:""}`;
    $("dpq-"+d.id).textContent="待ち依頼 "+q+"件";$("dpt-"+d.id).textContent=x.updatedAt?ago(x.updatedAt):"";
  });
  drawAll();
}
function renderQueue(){
  const open=reqs.filter(r=>r.status!=="done").sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  $("queue").innerHTML=open.length?open.map(r=>`<div class="item"><div class="t">${esc(r.topic)}</div><div class="m"><span class="pill s-${r.status==="running"?"running":"pending"}">${r.status==="running"?"処理中":"待ち"}</span><span>${esc(dname(r.dept))}部</span><span>${ago(r.createdAt)}</span></div></div>`).join(""):'<div class="none">待ちの依頼はありません。</div>';
}
function renderRuns(){
  const l=[...runs].sort((a,b)=>(b.finishedAt||"").localeCompare(a.finishedAt||"")).slice(0,6);
  $("runs").innerHTML=l.length?l.map((r,i)=>`<div class="item"><div class="t">${esc(r.topic)}</div><div class="m"><span class="pill s-done">完了</span><span>${esc(dname(r.dept))}部</span><span>${ago(r.finishedAt)}</span></div>
    ${r.angle?`<div>${esc(r.angle)}</div>`:""}${r.final?`<details><summary>最終ファイルを見る</summary><div class="row" style="margin-top:6px"><button class="ghost" data-copy="${i}">コピー</button></div><pre>${esc(r.final)}</pre></details>`:""}</div>`).join("")
    :'<div class="none">まだ成果物がありません。依頼を送ると、ここに最終ファイルが並びます。</div>';
  $("runs").querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const t=l[+b.dataset.copy].final;try{await navigator.clipboard.writeText(t);b.textContent="コピーしました"}catch{b.textContent="下の文を選択してコピー"}});
}
function all(){renderEsc();renderStats();renderDepts();renderQueue();renderRuns()}

/* ---- pixel office ---- */
const PS=4,RW=80,CELL=22,HEAD=6,RH=HEAD+CELL*5+4;
const PAL={floorA:"#b07d52",floorB:"#a5714a",wall:"#3b4a63",trim:"#2a3550",desk:"#8a6240",deskD:"#6b4a2f",mon:"#1c2230",chair:"#4a5366",skin:"#f1c9a0",ink:"#1a1a22",paper:"#fffbe8",green:"#3ecf7a",amber:"#f2b45a",red:"#e5483d",plant:"#3f9b5a",pot:"#8a4b2e"};
const LOOK={strategist:{hair:"#5b3a8c",shirt:"#7a56c2"},researcher:{hair:"#2b2b33",shirt:"#3b82c4"},writer:{hair:"#8a4b1f",shirt:"#e08a2e"},editor:{hair:"#c9c2b8",shirt:"#c24a4a"},publisher:{hair:"#1f5c4a",shirt:"#2fa58a"}};
let frame=0;
function R(c,col,x,y,w,h){c.fillStyle=col;c.fillRect(x,y,w,h)}
function setup(cv,w,h){const c=cv.getContext("2d");c.setTransform(PS,0,0,PS,0,0);c.imageSmoothingEnabled=false;return c}
function plant(c,x,y){R(c,PAL.pot,x+1,y+5,4,3);R(c,PAL.plant,x,y+1,6,4);R(c,PAL.plant,x+2,y,2,2)}
function txt(c,t,x,y,col,size){c.fillStyle=col;c.font=(size||6)+"px DotGothic16,sans-serif";c.textBaseline="top";c.fillText(t,x,y)}
function person(c,x,y,role,state,f){
  const L=LOOK[role];const sleeping=state==="idle",typing=state==="running",bob=(state==="done"&&f%4<2)?-1:0,shake=(state==="blocked"&&f%2)?1:0;
  R(c,PAL.chair,x-1,y+7,9,3);
  const yy=y+bob;
  R(c,L.hair,x+1+shake,yy,5,2);R(c,PAL.skin,x+1+shake,yy+2,5,3);
  if(sleeping){R(c,PAL.ink,x+2+shake,yy+3,1,1);R(c,PAL.ink,x+4+shake,yy+3,1,1)}
  else{R(c,PAL.ink,x+2+shake,yy+3,1,1);R(c,PAL.ink,x+4+shake,yy+3,1,1)}
  R(c,L.shirt,x,yy+5,7,4);
  if(role==="strategist")R(c,PAL.ink,x+1+shake,yy+2,5,1);
  if(role==="editor")R(c,"#e5483d",x+7,yy+6,1,3);
  if(role==="writer")R(c,"#f5d742",x+7,yy+5,1,3);
  if(role==="researcher")R(c,"#bfe6ff",x+7,yy+6,2,2);
  if(role==="publisher")R(c,L.hair,x+1,yy-1,5,1);
  if(typing){const h=f%2?0:-1;R(c,PAL.skin,x-1,yy+4+h,1,2);R(c,PAL.skin,x+7,yy+4-h,1,2)}
}
function monitor(c,x,y,state,f){
  R(c,PAL.mon,x,y,13,9);
  const sc=state==="running"?(f%2?"#2f6fb5":"#3a7fc8"):state==="done"?"#1f8f55":state==="blocked"?(f%2?"#b3261e":"#7a1a14"):"#2a3140";
  R(c,sc,x+1,y+1,11,6);R(c,PAL.mon,x+5,y+9,3,2);
  if(state==="running"){for(let i=0;i<3;i++)R(c,"#cfe4ff",x+2,y+2+i*2,3+((i+f)%3)*2,1)}
  if(state==="done"){R(c,"#d9ffe8",x+4,y+4,1,1);R(c,"#d9ffe8",x+5,y+5,1,1);R(c,"#d9ffe8",x+6,y+4,1,1);R(c,"#d9ffe8",x+7,y+3,1,1)}
}
function drawRoom(id){
  const cv=$("cv-"+id);if(!cv)return;const c=setup(cv);
  const x=deps[id]||{},st=x.stages||{};
  for(let yy=0;yy<RH;yy+=4)for(let xx=0;xx<RW;xx+=4)R(c,((xx+yy)/4)%2?PAL.floorA:PAL.floorB,xx,yy,4,4);
  R(c,PAL.wall,0,0,RW,HEAD);R(c,PAL.trim,0,HEAD-1,RW,1);
  ROLES.forEach((r,i)=>{
    const s=(st[r.id]||{}).state||"idle",y0=HEAD+i*CELL;
    plant(c,2,y0+6);
    R(c,PAL.deskD,24,y0+8,40,2);R(c,PAL.desk,24,y0+4,40,6);R(c,PAL.deskD,24,y0+9,40,1);
    monitor(c,38,y0-2,s,frame);
    R(c,"#e9e3d3",52,y0+5,6,3);R(c,PAL.ink,53,y0+6,4,1);
    person(c,34,y0+9,r.id,s,frame);
    txt(c,r.name,3,y0+16,"#fff4de",6);
    if(s==="blocked"){R(c,PAL.red,56,y0+10,7,8);txt(c,"!",58,y0+10,"#fff",7)}
    if(s==="idle"&&frame%6<3)txt(c,"z",46,y0+8,"#dfe8ff",6);
    if(s==="done"){R(c,PAL.green,56,y0+11,7,6);R(c,"#fff",58,y0+13,1,1);R(c,"#fff",59,y0+14,1,1);R(c,"#fff",60,y0+13,2,1)}
    // handoff paper: previous done, this running
    if(i>0&&s==="running"&&((st[ROLES[i-1].id]||{}).state==="done")){const py=y0-8+((frame%4)*2);R(c,PAL.paper,66,py,5,6);R(c,"#b9b49c",67,py+2,3,1)}
  });
}
function drawCeo(){
  const cv=$("ceoCanvas");if(!cv)return;const c=cv.getContext("2d");c.setTransform(PS,0,0,PS,0,0);c.imageSmoothingEnabled=false;
  const W=120,H=36;
  for(let yy=0;yy<H;yy+=4)for(let xx=0;xx<W;xx+=4)R(c,((xx+yy)/4)%2?"#5b6f94":"#52648a",xx,yy,4,4);
  R(c,PAL.wall,0,0,W,9);R(c,PAL.trim,0,8,W,1);
  R(c,"#bfe0ff",12,1,16,6);R(c,PAL.trim,19,1,2,6);R(c,"#bfe0ff",92,1,16,6);R(c,PAL.trim,99,1,2,6);
  plant(c,3,22);plant(c,110,22);
  R(c,PAL.deskD,36,28,48,2);R(c,"#9a6e43",36,22,48,7);
  monitor(c,53,12,"running",frame);
  const open=escs.filter(e=>e.status==="open").length;
  person(c,56,17,"strategist",open?"blocked":"done",frame);
  R(c,"#c8a24a",58,16,3,1);
  txt(c,"社長",70,24,"#fff4de",6);
  if(open){R(c,PAL.red,74,10,13,9);txt(c,"!"+open,76,11,"#fff",7)}
  else{R(c,"#f4efe2",74,17,5,4);R(c,"#d7cfb8",79,18,1,2)}
}

(async()=>{
  db=await claude.use("db");
  if(!db){$("esc").innerHTML='<div class="none err">データベースに接続できません。サインインして開いてください。</div>';$("send").disabled=true;return}
  const bad=e=>$("formMsg").innerHTML='<span class="err">読み込みエラー('+esc(e.code||"")+')</span>';
  db.collection("departments").onSnapshot(s=>{deps={};s.docs.forEach(d=>deps[d.id]=d.data());renderDepts()},bad);
  db.collection("requests").limit(200).onSnapshot(s=>{reqs=s.docs.map(d=>({id:d.id,...d.data()}));renderQueue();renderDepts();renderStats()},bad);
  db.collection("runs").orderBy("finishedAt","desc").limit(200).onSnapshot(s=>{runs=s.docs.map(d=>d.data());renderRuns();renderStats()},bad);
  db.collection("escalations").limit(100).onSnapshot(s=>{escs=s.docs.map(d=>({id:d.id,...d.data()}));renderEsc()},bad);
  $("form").addEventListener("submit",async ev=>{
    ev.preventDefault();const b=$("send");b.disabled=true;$("formMsg").textContent="送信中…";
    try{await db.collection("requests").add({dept:$("dept").value,topic:$("topic").value.trim(),notes:$("notes").value.trim(),status:"pending",createdAt:new Date().toISOString()});
      $("topic").value="";$("notes").value="";$("formMsg").textContent="依頼を送りました"}
    catch(e){$("formMsg").innerHTML='<span class="err">送れませんでした('+esc(e.code||"error")+')</span>'}
    b.disabled=false});
})();
